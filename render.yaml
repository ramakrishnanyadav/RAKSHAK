services:
  - type: web
    name: rakshak-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: MOCK_MATLAB
        value: "1"
      - key: ENGINE_STRICT_LICENCE
        value: "0"
      - key: APATH_ENVIRONMENT
        value: production
      - key: APATH_JWT_SECRET
        generateValue: true
      - key: APATH_CSRF_SECRET
        generateValue: true
      - key: APATH_CORS_ORIGINS
        value: '["*"]'

