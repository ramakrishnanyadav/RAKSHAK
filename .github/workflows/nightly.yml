name: Nightly Benchmark Regression

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  benchmark-regression:
    name: Nightly Benchmark & Tolerance Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest scipy torch jsonschema

      - name: Execute Nightly Benchmark Regression Against Golden Bounds
        run: |
          python engine/experiments/nightly_benchmark.py

      - name: Verify Broken Planner Changes Are Reliably Caught
        run: |
          python scripts/test_broken_planner_regression.py

      - name: Run Pytest Nightly Suite
        run: |
          python -m pytest tests/test_nightly_regression.py
