name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Linters & Typers
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic types-requests

      - name: Run Ruff Linter
        run: |
          ruff check engine backend

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Type-Check TypeScript Studio
        working-directory: studio
        run: |
          npm ci
          npx tsc --noEmit

  unit-api-contract-tests:
    name: Unit, API, Contract & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend & Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio hypothesis torch torchvision scipy jsonschema

      - name: Run Pytest Suites (Unit, API Matrix, Contract, Migrations)
        run: |
          python -m pytest --cov=backend/app --cov=engine --cov-report=term --cov-report=xml:coverage.xml tests/ backend/tests/

      - name: Enforce Coverage Gate (85% Services, 70% Overall)
        run: |
          python scripts/check_coverage_gate.py

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml

  vitest-components:
    name: Vitest Components & Visual Canvas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: studio
        run: npm ci

      - name: Run Vitest Suite (Components & Canvas Visual Regression)
        working-directory: studio
        run: npm test

  e2e-and-accessibility:
    name: Headless Playwright E2E & Axe WCAG 2.2 AA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt uvicorn

      - name: Start Background FastAPI Backend
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install Frontend Dependencies & Playwright
        working-directory: studio
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Headless Playwright Tests (E2E & Axe Route Audits)
        working-directory: studio
        env:
          CI: true
        run: |
          npx playwright test

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: studio/playwright-report/

  build-production:
    name: Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Build Studio Production Bundle
        working-directory: studio
        run: |
          npm ci
          npm run build
