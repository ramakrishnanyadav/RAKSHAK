version: "3.8"

networks:
  apath_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  storage_data:

services:
  # =====================================================================
  # 1. PostgreSQL Database
  # =====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: adaptive_path_postgres
    restart: unless-stopped
    networks:
      - apath_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_path}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptive_path"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 2. Redis Task Queue Broker
  # =====================================================================
  redis:
    image: redis:7-alpine
    container_name: adaptive_path_redis
    restart: unless-stopped
    networks:
      - apath_network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================================================
  # 3. MinIO S3 Object Storage
  # =====================================================================
  minio:
    image: minio/minio:latest
    container_name: adaptive_path_minio
    restart: unless-stopped
    networks:
      - apath_network
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket provisioner
  minio-init:
    image: minio/mc:latest
    container_name: adaptive_path_minio_init
    networks:
      - apath_network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin_secure_pass;
      /usr/bin/mc mb --ignore-existing localminio/apath-logs;
      /usr/bin/mc mb --ignore-existing localminio/apath-scenarios;
      echo 'MinIO buckets provisioned successfully.'
      exit 0;
      "

  # =====================================================================
  # 4. Backend REST API Service
  # =====================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive_path_api
    restart: unless-stopped
    networks:
      - apath_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APATH_ENVIRONMENT: ${APATH_ENVIRONMENT:-development}
      APATH_DATABASE_URL: ${APATH_DATABASE_URL:-postgresql://postgres:postgres_secure_pass@postgres:5432/adaptive_path}
      APATH_REDIS_URL: ${APATH_REDIS_URL:-redis://redis:6379/0}
      APATH_STORAGE_DIR: /app/storage
      APATH_JWT_SECRET: ${APATH_JWT_SECRET:-production-secret-replace-in-env-sih2026-adaptive-path}
      APATH_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost"]'
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_pass}
      MOCK_MATLAB: ${MOCK_MATLAB:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 5. Background Simulation Worker
  # =====================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive_path_worker
    restart: unless-stopped
    networks:
      - apath_network
    command: ["python", "-m", "backend.app.worker"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APATH_ENVIRONMENT: ${APATH_ENVIRONMENT:-development}
      APATH_DATABASE_URL: ${APATH_DATABASE_URL:-postgresql://postgres:postgres_secure_pass@postgres:5432/adaptive_path}
      APATH_REDIS_URL: ${APATH_REDIS_URL:-redis://redis:6379/0}
      APATH_STORAGE_DIR: /app/storage
      APATH_JWT_SECRET: ${APATH_JWT_SECRET:-production-secret-replace-in-env-sih2026-adaptive-path}
      MOCK_MATLAB: ${MOCK_MATLAB:-0}
      ENGINE_STRICT_LICENCE: 0
    volumes:
      - ./storage:/app/storage

  # =====================================================================
  # 6. Web Studio Frontend (Nginx SPA)
  # =====================================================================
  web:
    build:
      context: ./studio
      dockerfile: Dockerfile
    container_name: adaptive_path_web
    restart: unless-stopped
    networks:
      - apath_network
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
